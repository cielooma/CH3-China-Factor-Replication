[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ch3-china-factor-replication"
version = "0.1.0"
description = "Point-in-time replication and evaluation of China CH-3 equity factors"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.8", "openpyxl>=3.1"]

[project.optional-dependencies]
research = []
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
